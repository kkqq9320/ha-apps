name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  check:
    name: App folders match their releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Compares each app folder with its release tag and pulls its image anonymously from GHCR.
      - run: python tools/sync_app.py check

  apps:
    name: List app folders
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: list
        run: echo "apps=$(python tools/sync_app.py list)" >> "$GITHUB_OUTPUT"

  lint:
    name: Home Assistant app linter
    needs: apps
    if: needs.apps.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.app }}
