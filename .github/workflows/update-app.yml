name: Update app

# Run by hand after an app repository publishes a release:
#   gh workflow run update-app.yml -f app=mttl_w01 -f version=26.10.0
# Pull requests opened with GITHUB_TOKEN do not start other workflows, so every check runs here.

on:
  workflow_dispatch:
    inputs:
      app:
        description: App slug in apps.json, for example mttl_w01
        required: true
        type: string
      version:
        description: Released version, for example 26.10.0
        required: true
        type: string

permissions:
  contents: read

env:
  APP: ${{ inputs.app }}
  VERSION: ${{ inputs.version }}

jobs:
  # Runs the third-party linter, so it gets a read-only token and no stored git credentials.
  check:
    name: Check the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Checks apps.json, the version, the canonical files and the image before it writes the folder.
      - name: Copy the release's canonical files
        run: python tools/sync_app.py update "$APP" "$VERSION"
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ inputs.app }}

  # Can push, so it uses GitHub's own actions only and builds the folder from the release again.
  pr:
    name: Open a pull request
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Copy the release's canonical files
        run: python tools/sync_app.py update "$APP" "$VERSION" --skip-image
      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repository=$(python -c 'import json, sys; print(json.load(open("apps.json"))[sys.argv[1]]["repository"])' "$APP")
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "update/$APP-$VERSION"
          git add -A -- "$APP"
          git commit -m "$APP $VERSION"
          git push origin "update/$APP-$VERSION"
          gh pr create --title "$APP $VERSION" --base main --head "update/$APP-$VERSION" \
            --body "Release: https://github.com/$repository/releases/tag/v$VERSION"
